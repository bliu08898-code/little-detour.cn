services:
  - type: web
    name: little-detour
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: AMAP_WEB_SERVICE_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        value: https://ws-86mvcecktpbr30i3.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen-flash
      - key: AMAP_INPUT_COORDSYS
        value: gps
